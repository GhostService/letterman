# XcodeGen spec. After changing this file run `xcodegen` in this folder to regenerate HourTracker.xcodeproj.
name: HourTracker
options:
  bundleIdPrefix: com.tiredghost
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  libxlsxwriter:
    url: https://github.com/jmcnamara/libxlsxwriter
    exactVersion: 1.2.4

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  HourTracker:
    type: application
    platform: iOS
    sources:
      - path: HourTracker
        excludes:
          - Info.plist
    dependencies:
      - package: libxlsxwriter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiredghost.hourtracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Set your Apple ID team in Xcode (Signing & Capabilities) to install on your iPhone.
        CODE_SIGN_STYLE: Automatic
    info:
      path: HourTracker/Info.plist
      properties:
        # The app's name on the home screen. Change it here when you pick a real name.
        CFBundleDisplayName: Hour Tracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - BigShouldersDisplay-Black.ttf
          - BigShouldersDisplay-ExtraBold.ttf
          - Figtree-Regular.ttf
          - Figtree-Medium.ttf
          - Figtree-SemiBold.ttf
          - Figtree-Bold.ttf
        NSCalendarsFullAccessUsageDescription: Hour Tracker adds your volunteer shifts to a "Volunteering" calendar so they show up in the Calendar app.
        NSAppTransportSecurity:
          # Lets Simulator debug builds reach PocketBase on this Mac. Real servers must use HTTPS.
          NSAllowsLocalNetworking: true
