# XcodeGen spec. After changing this file run `xcodegen` in this folder to regenerate Letterman.xcodeproj.
name: Letterman
options:
  bundleIdPrefix: com.tiredghost
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  libxlsxwriter:
    url: https://github.com/jmcnamara/libxlsxwriter
    exactVersion: 1.2.4

settings:
  base:
    # Version shown to users. Change for a new release.
    MARKETING_VERSION: "0.6"
    # Build number. Must go up by one for EVERY upload to TestFlight.
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  Letterman:
    type: application
    platform: iOS
    sources:
      - path: Letterman
        excludes:
          - Info.plist
    dependencies:
      - package: libxlsxwriter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiredghost.letterman
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Your Apple team ID (Xcode > Settings > Accounts), so `xcodegen` keeps your signing team.
        # This is the free Personal Team. After joining the Apple Developer Program, replace it with
        # the paid team's ID; TestFlight needs that one (FIRST_SETUP.md, Part E).
        DEVELOPMENT_TEAM: VPNAM5Q3CQ
    info:
      path: Letterman/Info.plist
      properties:
        # The app's name on the home screen. Change it here when you pick a real name.
        CFBundleDisplayName: Letterman
        # The App Store category.
        LSApplicationCategoryType: public.app-category.lifestyle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - BigShouldersDisplay-Black.ttf
          - BigShouldersDisplay-ExtraBold.ttf
          - Figtree-Regular.ttf
          - Figtree-Medium.ttf
          - Figtree-SemiBold.ttf
          - Figtree-Bold.ttf
        # Only Apple's built-in encryption (HTTPS, Keychain) is used, which is exempt from export
        # paperwork. Without this, App Store Connect asks about it on every upload.
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: Letterman adds your volunteer shifts to a "Volunteering" calendar so they show up in the Calendar app.
        NSLocationWhenInUseUsageDescription: Letterman uses your location once to show volunteer opportunities near you. It stays on your phone.
        NSAppTransportSecurity:
          # Lets Simulator debug builds reach PocketBase on this Mac. Real servers must use HTTPS.
          NSAllowsLocalNetworking: true
